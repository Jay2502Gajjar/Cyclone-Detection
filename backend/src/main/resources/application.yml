server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cyclovision-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cyclovision}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      max-lifetime: 60000
      idle-timeout: 30000
      connection-timeout: 60000
      keepalive-time: 30000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 100
          order_inserts: true
          order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

cyclovision:
  mock-provider:
    enabled: false
  demo-data:
    enabled: false
  ingestion:
    scheduler:
      enabled: ${INGESTION_SCHEDULER_ENABLED:true}
      fixed-delay-ms: ${INGESTION_FIXED_DELAY_MS:21600000}
      initial-delay-ms: ${INGESTION_INITIAL_DELAY_MS:21600000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: when_authorized

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}