server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cyclovision-backend

  datasource:
    url: ${SUPABASE_DB_URL:${DB_URL:}}
    username: ${SUPABASE_DB_USERNAME:${DB_USERNAME:}}
    password: ${SUPABASE_DB_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      max-lifetime: 600000
      idle-timeout: 300000
      connection-timeout: 30000
      keepalive-time: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 100
          order_inserts: true
          order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

cyclovision:
  mock-provider:
    enabled: false
  demo-data:
    enabled: false
  ingestion:
    scheduler:
      enabled: ${CYCLOVISION_SCHEDULER_ENABLED:true}
      fixed-delay-ms: ${CYCLOVISION_SCHEDULER_FIXED_DELAY_MS:21600000}
      initial-delay-ms: ${CYCLOVISION_SCHEDULER_INITIAL_DELAY_MS:300000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: when_authorized

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}